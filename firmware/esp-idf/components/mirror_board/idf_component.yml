dependencies:
  idf: ">=5.4"

  # ESP32-P4: MIPI-CSI capture and the ISP live in esp_video; the IMX519 and
  # AK7375 drivers are the vendored component in ../esp_cam_sensor_imx, which
  # the component manager finds locally and does not download.
  espressif/esp_video:
    version: "^2.4"
    rules:
      - if: "target == esp32p4"

  # Face detection for face-steered AE/AF (CONFIG_MIRROR_FACE_AE): ESP-DL's
  # two-stage MSR+MNP int8 face model, which supports esp32p4 and IDF >= 5.3.
  # Pinned exactly, with ESP-DL and its two dependencies, because
  # dependencies.lock is git-ignored here and human_face_detect only asks for
  # esp-dl ~3.3.0 - a fresh solve would otherwise pick up whatever ESP-DL
  # shipped that week, and its kernels and the model format move together.
  espressif/human_face_detect:
    version: "==0.5.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp-dl:
    version: "==3.3.9"
    rules:
      - if: "target == esp32p4"
  espressif/dl_fft:
    version: "==0.7.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_new_jpeg:
    version: "==1.0.2"
    rules:
      - if: "target == esp32p4"

  # The P4 has no radio. esp_wifi_remote routes the esp_wifi API to an
  # ESP32-C6 and esp_hosted carries it over SDIO; the P4<->C6 pins are
  # esp_hosted's built-in ESP32-P4 defaults and match the Waveshare board, so
  # nothing is overridden.
  #
  # Pinned exactly, not to a range. The host half here and the slave firmware
  # on the C6 speak one RPC protocol and have to be the same release; with a
  # range, a fresh dependency solve can float the host ahead of what the C6 is
  # running, and a mismatched pair does not fail at boot - it fails hours later
  # as RPC timeouts and a Wi-Fi link that silently goes away. Moving this means
  # building and OTA-ing the matching network_adapter.bin onto the C6 too.
  espressif/esp_hosted:
    version: "==2.13.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target == esp32p4"

  # ESP32-S3: DVP capture, with the OV5640 producing JPEG itself.
  espressif/esp32-camera:
    version: "*"
    rules:
      - if: "target == esp32s3"

  # The WS2812 on the S3 board. The P4 rig uses a discrete RGB LED on LEDC
  # PWM instead, which needs no component.
  espressif/led_strip:
    version: "^3"
    rules:
      - if: "target == esp32s3"
