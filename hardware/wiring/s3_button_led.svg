<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="system-ui, sans-serif" font-size="14">
  <rect width="820" height="420" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">ESP32-S3 (Freenove S3-WROOM CAM): pushbutton + onboard RGB LED</text>
  <!-- board -->
  <rect x="60" y="80" width="260" height="280" rx="8" fill="#e8f0e8" stroke="#333"/>
  <text x="90" y="110" font-weight="bold">ESP32-S3 board</text>
  <text x="90" y="135" fill="#555">OV5640 on the DVP header (already wired)</text>
  <!-- pins -->
  <line x1="320" y1="190" x2="380" y2="190" stroke="#333" stroke-width="2"/>
  <text x="200" y="195" text-anchor="end">GPIO 1 (button)</text>
  <text x="326" y="182" fill="#555" font-size="12">header pin "1"</text>
  <line x1="320" y1="260" x2="380" y2="260" stroke="#333" stroke-width="2"/>
  <text x="200" y="265" text-anchor="end">GND</text>
  <line x1="320" y1="320" x2="340" y2="320" stroke="#333" stroke-width="2"/>
  <text x="200" y="325" text-anchor="end">GPIO 48 → WS2812 RGB LED</text>
  <text x="346" y="325" fill="#555" font-size="12">on the board, no wiring</text>
  <!-- switch -->
  <line x1="380" y1="190" x2="470" y2="190" stroke="#333" stroke-width="2"/>
  <circle cx="470" cy="190" r="4" fill="#333"/>
  <line x1="470" y1="190" x2="540" y2="160" stroke="#333" stroke-width="2"/>
  <circle cx="550" cy="190" r="4" fill="#333"/>
  <line x1="550" y1="190" x2="640" y2="190" stroke="#333" stroke-width="2"/>
  <text x="455" y="140" font-weight="bold">SW1 momentary pushbutton</text>
  <line x1="640" y1="190" x2="640" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="260" x2="640" y2="260" stroke="#333" stroke-width="2"/>
  <!-- ground symbol -->
  <line x1="640" y1="260" x2="640" y2="285" stroke="#333" stroke-width="2"/>
  <line x1="620" y1="285" x2="660" y2="285" stroke="#333" stroke-width="2"/>
  <line x1="627" y1="292" x2="653" y2="292" stroke="#333" stroke-width="2"/>
  <line x1="634" y1="299" x2="646" y2="299" stroke="#333" stroke-width="2"/>
  <!-- notes -->
  <text x="380" y="330" fill="#333">Pull-up is the S3's internal one (enabled in firmware), so no resistor.</text>
  <text x="380" y="352" fill="#333">Press = GPIO 1 pulled to GND. 60 ms debounce, same as the Pi.</text>
  <text x="380" y="374" fill="#333">LED: soft white ready · 3 amber pulses countdown · rapid amber focus/capture</text>
  <text x="380" y="396" fill="#333">· green flash committed · blue pulse uploading · red triple error</text>
</svg>
