[package]
name = "server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
default-run = "server"

[lib]
path = "src/app.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "server-dump-openapi"
path = ".nextrs/dump-openapi.rs"

[[bin]]
name = "index"
path = "api/index.rs"

[build-dependencies]
nextrs = { version = "0.6.0", features = ["build", "tsx"] }

[dependencies]
nextrs = { version = "0.6.0", features = ["vercel"] }
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto", "xml"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libsql = { version = "0.9", default-features = false, features = ["core", "remote", "tls"] }
serde = { version = "1", features = ["derive"] }
utoipa = "5"
vercel_runtime = { version = "2", features = ["axum"] }
