[package]
name = "server"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "server"

[lib]
path = "src/app.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "server-dump-openapi"
path = ".nextrs/dump-openapi.rs"

[[bin]]
name = "index"
path = "api/index.rs"

[[bin]]
name = "daily-mirror-auth"
path = "src/bin/daily_mirror_auth.rs"

[build-dependencies]
nextrs = { version = "0.6.0", features = ["build", "tsx"] }

[dependencies]
nextrs = { version = "0.6.0", features = ["vercel"] }
axum = "0.8"
argon2 = "0.5.3"
base64 = "0.22"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto", "xml"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libsql = { version = "0.9", default-features = false, features = ["core", "remote", "tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.4"
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
utoipa = "5"
uuid = { version = "1", features = ["v4"] }
vercel_runtime = { version = "2", features = ["axum"] }
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
